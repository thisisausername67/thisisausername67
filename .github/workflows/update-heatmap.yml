name: Update Contribution Heatmap

on:
  schedule:
    # Runs once a day at 03:17 UTC (off the hour to avoid GitHub's cron rush)
    - cron: "17 3 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" trigger
  push:
    branches: [main]
    paths:
      - "config.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate heatmap
        env:
          GH_TOKEN: ${{ secrets.HEATMAP_TOKEN }}
          GH_USERNAME: ${{ vars.HEATMAP_USERNAME }}
        run: python scripts/generate_heatmap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution heatmap [skip ci]"
            git push
          fi
